[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkshift-furniture-layout"
version = "0.1.0"
description = "Rule-based furniture layout generation and scoring engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sparkshift-layout = "furniture_layout.cli:main"
sparkshift-layout-demo = "furniture_layout.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
