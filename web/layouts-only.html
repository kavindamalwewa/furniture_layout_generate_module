<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Furniture Layout Generator</title>
  <style>
    :root{font:15px Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #dfe4ee;padding:18px 5vw;display:flex;align-items:center;gap:18px}.top h1{font-size:21px;margin:0 auto 0 0;color:#2360e8}.upload{background:linear-gradient(100deg,#2464ee,#6530ef);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:750;cursor:pointer}.wrap{max-width:1180px;margin:32px auto;padding:0 22px}.intro{text-align:center;margin:50px auto;max-width:560px}.intro h2{font-size:28px;margin-bottom:8px}.intro p,.status{color:#6c7890}.status{text-align:center;margin:24px}.error{color:#c93645;background:#ffe9eb;padding:12px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.card{background:#fff;border:2px solid #dfe4ee;border-radius:20px;padding:16px;box-shadow:0 8px 25px #17203312}.card:first-child{border-color:#7657ff}.preview{height:245px;border-radius:14px;background:#f8fafc;border:1px solid #e3e7ef;overflow:hidden}.preview svg{width:100%;height:100%;display:block}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.meta h3{font-size:20px;margin:0}.score{width:58px;height:58px;border:6px solid #31c47c;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.metric{text-align:center;background:#f2f5f9;border-radius:9px;padding:9px 3px;color:#6c7890;font-size:11px}.metric strong{display:block;color:#172033;font-size:13px;margin-top:3px}.download{display:none;background:#fff;border:1px solid #cfd7e5;border-radius:10px;padding:11px 15px;cursor:pointer}@media(max-width:600px){.top{padding:14px}.top h1{font-size:17px}.wrap{padding:0 14px;margin-top:20px}}
  </style>
</head>
<body>
  <header class="top"><h1>Furniture Layout Generator</h1><input id="file" type="file" accept="application/json" hidden><button class="upload" id="choose">Choose JSON</button><button class="download" id="download">Download result JSON</button></header>
  <main class="wrap"><section class="intro" id="intro"><h2>Generate furniture layouts</h2><p>Select the room JSON file. Layouts will be generated automatically—no drawing, calibration or room editing required.</p></section><div class="status" id="status"></div><section class="grid" id="layouts"></section></main>
  <script>
    const file=document.getElementById('file'),choose=document.getElementById('choose'),status=document.getElementById('status'),grid=document.getElementById('layouts'),intro=document.getElementById('intro'),download=document.getElementById('download');let result=null;
    const api=async(path,data)=>{let response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await response.json();if(!response.ok)throw Error(body.error||'Request failed');return body};
    const points=ring=>ring.map(p=>p.join(',')).join(' ');
    function preview(room,layout,openings){let ring=room.polygon.outer,x=ring.map(p=>p[0]),y=ring.map(p=>p[1]),minX=Math.min(...x),minY=Math.min(...y),w=Math.max(...x)-minX,h=Math.max(...y)-minY,pad=Math.max(w,h)*.1,stroke=Math.max(w,h)*.009;return`<svg viewBox="${minX-pad} ${minY-pad} ${w+pad*2} ${h+pad*2}" aria-label="Generated room layout"><polygon points="${points(ring)}" fill="#fff" stroke="#64748b" stroke-width="${stroke}"/>${openings.map(o=>`<line x1="${o.span[0][0]}" y1="${o.span[0][1]}" x2="${o.span[1][0]}" y2="${o.span[1][1]}" stroke="${o.kind==='door'?'#22b36e':'#0ea5e9'}" stroke-width="${stroke*2.2}"/>`).join('')}${layout.placements.map(p=>`<g transform="rotate(${p.rotation||0} ${p.x} ${p.y})"><rect x="${p.x}" y="${p.y}" width="${p.width}" height="${p.depth}" rx="${stroke}" fill="#dce5ec" stroke="#708399" stroke-width="${stroke*.65}"/><text x="${p.x+p.width/2}" y="${p.y+p.depth/2}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.max(7,Math.min(p.width,p.depth)*.16)}" fill="#40536a">${p.catalogId}</text></g>`).join('')}</svg>`}
    function show(project,generated){let room=project.rooms[0],openings=project.openings||[];grid.innerHTML=generated.layouts.map((layout,i)=>{let c=layout.scoreComponents||{},door=Math.round((c.opening_access||0)*10),space=Math.round((c.free_space||0)/30*100),spacing=Math.round((c.distribution||0)*5);return`<article class="card"><div class="preview">${preview(room,layout,openings)}</div><div class="meta"><h3>Layout ${String.fromCharCode(65+i)}</h3><div class="score">${Math.round(layout.score)}</div></div><div class="metrics"><div class="metric">Door access<strong>${door}%</strong></div><div class="metric">Open space<strong>${space}%</strong></div><div class="metric">Spacing<strong>${spacing}%</strong></div></div></article>`}).join('');intro.style.display='none';download.style.display='block';status.textContent=`Generated ${generated.layouts.length} layouts for ${room.name}.`}
    choose.onclick=()=>file.click();file.onchange=async()=>{let selected=file.files[0];if(!selected)return;status.className='status';status.textContent='Generating layouts…';grid.innerHTML='';try{let data=JSON.parse(await selected.text()),project=await api('/api/import/layout-project',{sourceName:selected.name,data}),room=project.rooms[0],furniture=room.furniture.map(i=>({id:i[0],quantity:i[2],width:i[3],depth:i[4],required:i[5],allowedRotations:[0,90]}));result=await api('/api/layouts/generate',{roomId:room.id,polygon:room.polygon,scale:project.scale,openings:project.openings,fixedObstacles:[],furniture,count:5,seed:42,searchBudgetMs:3000});if(!result.layouts.length)throw Error(result.reasons?.[0]?.message||'No feasible layouts');show(project,result)}catch(error){status.className='status error';status.textContent=error.message}};
    download.onclick=()=>{let blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='generated-layouts.json';a.click();URL.revokeObjectURL(a.href)};
  </script>
</body>
</html>
