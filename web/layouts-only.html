<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Furniture Layout Generator</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>
  <style>
    :root{font:15px Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #dfe4ee;padding:18px 5vw;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:21px;margin:0 auto 0 0;color:#2360e8}.upload,.generate{background:linear-gradient(100deg,#2464ee,#6530ef);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:750;cursor:pointer}.generate{background:linear-gradient(100deg,#119c6b,#22b36e)}.generate:disabled{background:#b8c1cc;cursor:not-allowed}.wrap{max-width:1180px;margin:32px auto;padding:0 22px}.intro{text-align:center;margin:50px auto;max-width:560px}.intro h2{font-size:28px;margin-bottom:8px}.intro p,.status{color:#6c7890}.status{text-align:center;margin:24px}.error{color:#c93645;background:#ffe9eb;padding:12px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.card{background:#fff;border:2px solid #dfe4ee;border-radius:20px;padding:16px;box-shadow:0 8px 25px #17203312}.card:first-child{border-color:#7657ff}.preview{height:245px;border-radius:14px;background:#f8fafc;border:1px solid #e3e7ef;overflow:hidden}.preview svg{width:100%;height:100%;display:block}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.meta h3{font-size:20px;margin:0}.score{width:58px;height:58px;border:6px solid #31c47c;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.metric{text-align:center;background:#f2f5f9;border-radius:9px;padding:9px 3px;color:#6c7890;font-size:11px}.metric strong{display:block;color:#172033;font-size:13px;margin-top:3px}.download{display:none;background:#fff;border:1px solid #cfd7e5;border-radius:10px;padding:11px 15px;cursor:pointer}@media(max-width:600px){.top{padding:14px}.top h1{width:100%;font-size:17px}.wrap{padding:0 14px;margin-top:20px}}
  </style>
  <style>.layout-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.layout-download,.layout-view{width:100%;border:0;border-radius:10px;padding:12px 10px;font-weight:700;cursor:pointer}.layout-download{background:#fff;color:#2949ce;border:1px solid #9cabe9}.layout-view{background:#3c5ee8;color:#fff}.layout-download:hover{background:#f3f5ff}.layout-view:hover{background:#2949ce}.layout-download:active,.layout-view:active{transform:translateY(1px)}.viewer{position:fixed;inset:0;z-index:20;background:#edf1f5;display:none}.viewer.open{display:block}.viewer-host{position:absolute;inset:0}.viewer-back,.viewer-toggle{position:absolute;z-index:3;top:28px;border:0;border-radius:30px;background:#fffffff2;box-shadow:0 14px 35px #17203320;padding:17px 22px;font-size:16px;font-weight:800;color:#172033;cursor:pointer}.viewer-back{left:28px}.viewer-back span{font-size:21px;margin-right:8px;vertical-align:-1px}.viewer-toggle{right:28px}.viewer-toggle span{font-size:22px;vertical-align:-2px;margin-right:9px}.viewer-panel{position:absolute;display:none;z-index:3;right:28px;top:92px;width:230px;background:#fffffff2;backdrop-filter:blur(10px);box-shadow:0 14px 35px #17203324;border-radius:18px;padding:14px}.viewer-panel.open{display:grid;gap:8px}.viewer-title{padding:4px 3px 10px;font-weight:800}.viewer-action{border:1px solid #cfd7e5;background:#fff;color:#172033;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;text-align:left}.viewer-close{background:#172033;color:#fff;border-color:#172033}.viewer-error{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:10px;background:#ffe9eb;color:#c93645;display:none}@media(max-width:600px){.viewer-back,.viewer-toggle{top:12px;padding:13px 16px}.viewer-back{left:12px}.viewer-toggle{right:12px}.viewer-panel{right:12px;top:68px}.layout-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><h1>Furniture Layout Generator</h1><input id="file" type="file" accept="application/json" hidden><button class="upload" id="choose">Choose JSON</button><button class="generate" id="generate" disabled>Generate Layouts</button></header>
  <main class="wrap"><section class="intro" id="intro"><h2>Generate furniture layouts</h2><p>Select the room JSON file, then use the generate button. Click it again whenever you need six new arrangements.</p></section><div class="status" id="status"></div><section class="grid" id="layouts"></section></main>
  <section class="viewer" id="viewer" aria-hidden="true" aria-label="3D room preview"><div class="viewer-host" id="viewer-host"></div><button class="viewer-back" id="viewer-back" aria-label="Back to generated layouts"><span>←</span>Back to Layouts</button><button class="viewer-toggle" id="viewer-toggle" aria-expanded="false"><span>☰</span>Viewer</button><div class="viewer-panel" id="viewer-panel"><div class="viewer-title" id="viewer-title">3D Layout</div><button class="viewer-action" id="perspective">Perspective</button><button class="viewer-action" id="top-view">Top View</button><button class="viewer-action" id="reset-view">Reset Camera</button><button class="viewer-action viewer-close" id="close-viewer" aria-label="Close 3D preview">Close Viewer</button></div><div class="viewer-error" id="viewer-error" role="alert"></div></section>
  <script type="module">
    import {createRoomVisualizer} from './room-visualizer.js';
    const file=document.getElementById('file'),choose=document.getElementById('choose'),generate=document.getElementById('generate'),status=document.getElementById('status'),grid=document.getElementById('layouts'),intro=document.getElementById('intro');let result=null,project=null,furniture=[],generationRound=0,generationHistory=[];
    const api=async(path,data)=>{let response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await response.json();if(!response.ok)throw Error(body.error||'Request failed');return body};
    const points=ring=>ring.map(p=>p.join(',')).join(' ');
    function preview(room,layout,openings){let ring=room.polygon.outer,x=ring.map(p=>p[0]),y=ring.map(p=>p[1]),minX=Math.min(...x),minY=Math.min(...y),w=Math.max(...x)-minX,h=Math.max(...y)-minY,pad=Math.max(w,h)*.1,stroke=Math.max(w,h)*.009;return`<svg viewBox="${minX-pad} ${minY-pad} ${w+pad*2} ${h+pad*2}" aria-label="Generated room layout"><polygon points="${points(ring)}" fill="#fff" stroke="#64748b" stroke-width="${stroke}"/>${openings.map(o=>`<line x1="${o.span[0][0]}" y1="${o.span[0][1]}" x2="${o.span[1][0]}" y2="${o.span[1][1]}" stroke="${o.kind==='door'?'#22b36e':'#0ea5e9'}" stroke-width="${stroke*2.2}"/>`).join('')}${layout.placements.map(p=>`<g transform="rotate(${p.rotation||0} ${p.x} ${p.y})"><rect x="${p.x}" y="${p.y}" width="${p.width}" height="${p.depth}" rx="${stroke}" fill="#dce5ec" stroke="#708399" stroke-width="${stroke*.65}"/><text x="${p.x+p.width/2}" y="${p.y+p.depth/2}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.max(7,Math.min(p.width,p.depth)*.16)}" fill="#40536a">${p.catalogId}</text></g>`).join('')}</svg>`}
    function show(project,generated){let room=project.rooms[0],openings=project.openings||[];grid.innerHTML=generated.layouts.map((layout,i)=>{let c=layout.scoreComponents||{},door=Math.round((c.door_access||0)/20*100),space=Math.round((c.open_space||0)/20*100),spacing=Math.round((c.spacing||0)/15*100),sofa=Math.round((c.sofa_wall||0)/15*100),table=Math.round((c.coffee_table_center||0)/10*100);return`<article class="card"><div class="preview">${preview(room,layout,openings)}</div><div class="meta"><h3>Layout ${String.fromCharCode(65+i)}</h3><div class="score">${Math.round(layout.score)}</div></div><div class="metrics"><div class="metric">Door access<strong>${door}%</strong></div><div class="metric">Open space<strong>${space}%</strong></div><div class="metric">Spacing<strong>${spacing}%</strong></div><div class="metric">Sofa at wall<strong>${sofa}%</strong></div><div class="metric">Table centered<strong>${table}%</strong></div></div><div class="layout-actions"><button class="layout-download" data-download-index="${i}">Download JSON</button><button class="layout-view" data-view-index="${i}">View in 3D</button></div></article>`}).join('');grid.querySelectorAll('[data-download-index]').forEach(button=>button.onclick=()=>downloadLayout(Number(button.dataset.downloadIndex)));grid.querySelectorAll('[data-view-index]').forEach(button=>button.onclick=()=>viewLayout(Number(button.dataset.viewIndex)));intro.style.display='none';status.textContent=`Generated ${generated.layouts.length} layouts for ${room.name}.`}
    choose.onclick=()=>file.click();file.onchange=async()=>{let selected=file.files[0];if(!selected)return;status.className='status';status.textContent='Loading JSON…';grid.innerHTML='';generate.disabled=true;try{let data=JSON.parse(await selected.text());project=await api('/api/import/layout-project',{sourceName:selected.name,data});let room=project.rooms[0];furniture=room.furniture.map(i=>({id:i[0],quantity:i[2],width:i[3],depth:i[4],required:i[5],allowedRotations:[0,90]}));generationRound=0;generationHistory=[];result=null;generate.disabled=false;intro.style.display='none';status.textContent=`${room.name} loaded. Click Generate Layouts.`}catch(error){project=null;status.className='status error';status.textContent=error.message}};
    generate.onclick=async()=>{if(!project||generate.disabled)return;let room=project.rooms[0],excludeLayouts=generationHistory.slice(-120).map(layout=>({placements:layout.placements.map(p=>({catalogId:p.catalogId,x:p.x,y:p.y,rotation:p.rotation}))}));generate.disabled=true;status.className='status';status.textContent='Generating six new layouts…';try{generationRound++;let generated=await api('/api/layouts/generate',{roomId:room.id,roomType:room.type,polygon:room.polygon,scale:project.scale,openings:project.openings,fixedObstacles:[],furniture,count:6,seed:42+generationRound,excludeLayouts,searchBudgetMs:6000});if(!generated.layouts.length)throw Error(generated.reasons?.[0]?.message||'No more unique layouts are available for this room.');result=generated;generationHistory.push(...generated.layouts);show(project,result)}catch(error){status.className='status error';status.textContent=error.message}finally{generate.disabled=false}};
    const viewer=document.getElementById('viewer'),viewerHost=document.getElementById('viewer-host'),viewerError=document.getElementById('viewer-error');let visualizer=null;
    function layout3d(index){let layout=result.layouts[index],room=project.rooms[0],scale=project.scale.metersPerPixel,ring=room.polygon.outer,minX=Math.min(...ring.map(p=>p[0])),minY=Math.min(...ring.map(p=>p[1])),toFloor=p=>({x:+((p[0]-minX)*scale).toFixed(4),z:+((p[1]-minY)*scale).toFixed(4)}),heights={bed:.6,wardrobe:2,nightstand:.55,'study-table':.75,desk:.75,sofa:.85,'tv-unit':.55,tv:.55,'coffee-table':.45,chair:.9,armchair:.9};let furniture3d=layout.placements.map(p=>{let angle=(p.rotation||0)*Math.PI/180,c=Math.cos(angle),s=Math.sin(angle),cx=p.x+(p.width*c-p.depth*s)/2,cy=p.y+(p.width*s+p.depth*c)/2,key=String(p.catalogId).toLowerCase(),height=p.heightMeters||heights[key]||.8;return{id:p.id,type:p.catalogId,position:{x:+((cx-minX)*scale).toFixed(4),y:+(height/2).toFixed(4),z:+((cy-minY)*scale).toFixed(4)},dimensions:{widthMeters:p.widthMeters,depthMeters:p.depthMeters,heightMeters:height},rotationYRadians:+(-angle).toFixed(6)}});let openings=(project.openings||[]).map(o=>({id:o.id,kind:o.kind,span:[toFloor(o.span[0]),toFloor(o.span[1])],widthMeters:+(Math.hypot(o.span[1][0]-o.span[0][0],o.span[1][1]-o.span[0][1])*scale).toFixed(4),bottomMeters:o.kind==='door'?0:.9,heightMeters:o.kind==='door'?2.1:1.2}));return{schemaVersion:'threejs-room-layout-1.0',units:'meters',coordinateSystem:{horizontal:'x',vertical:'y',depth:'z',origin:'room-polygon-min-corner'},room:{id:room.id,name:room.name,heightMeters:2.8,floorPolygon:ring.map(toFloor),openings},furniture:furniture3d}}
    function downloadLayout(index){let payload=layout3d(index),layout=result.layouts[index],blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${layout.id}-threejs.json`;link.click();URL.revokeObjectURL(url)}
    function viewLayout(index){let payload=layout3d(index);viewer.classList.add('open');document.body.style.overflow='hidden';viewer.setAttribute('aria-hidden','false');document.getElementById('viewer-title').textContent=`${payload.room.name} — Layout ${String.fromCharCode(65+index)}`;viewerError.style.display='none';try{if(!visualizer)visualizer=createRoomVisualizer({container:viewerHost,layout:payload});else visualizer.loadLayout(payload);visualizer.resize()}catch(error){viewerError.textContent=error.message;viewerError.style.display='block'}}
    const viewerToggle=document.getElementById('viewer-toggle'),viewerPanel=document.getElementById('viewer-panel');viewerToggle.onclick=()=>{let open=viewerPanel.classList.toggle('open');viewerToggle.setAttribute('aria-expanded',String(open))};document.getElementById('perspective').onclick=()=>visualizer?.setPerspectiveView();document.getElementById('top-view').onclick=()=>visualizer?.setTopView();document.getElementById('reset-view').onclick=()=>visualizer?.resetCamera();const closeViewer=()=>{viewer.classList.remove('open');viewerPanel.classList.remove('open');viewerToggle.setAttribute('aria-expanded','false');viewer.setAttribute('aria-hidden','true');document.body.style.overflow=''};document.getElementById('close-viewer').onclick=closeViewer;document.getElementById('viewer-back').onclick=closeViewer;document.addEventListener('keydown',event=>{if(event.key==='Escape'&&viewer.classList.contains('open'))closeViewer()});
  </script>
</body>
</html>
