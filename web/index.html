<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparkshift Layout Lab</title>
  <style>
    :root{--bg:#f4f7fa;--panel:#ffffff;--panel2:#f7fafb;--line:#dce5e9;--text:#16252b;--muted:#6f7e86;--teal:#08a899;--teal2:#069688;--green:#25b968;--amber:#e9a900;--red:#ea4f5b;--purple:#6c5ce7;--shadow:0 18px 48px #18343f18;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfdfd 0,var(--bg) 42%);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
    .shell{max-width:1500px;margin:auto;padding:38px 28px}.heading{display:flex;align-items:flex-end;gap:18px;margin-bottom:24px}.heading h1{margin:0;font-size:clamp(25px,3vw,38px);letter-spacing:-1.2px;color:#087f77}.heading p{margin:6px 0 0;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:10px;align-items:center}.room-select{border:1px solid #cbd8dd;background:#fff;color:#25363d;border-radius:11px;padding:10px 34px 10px 13px;font-weight:700;box-shadow:0 3px 10px #18343f0c}.btn{border:1px solid #cbd8dd;background:#fff;color:#34474f;border-radius:11px;padding:10px 16px;font-weight:700;box-shadow:0 3px 10px #18343f0c}.btn:hover,.room-select:hover{border-color:#79929c}.btn.primary{background:linear-gradient(135deg,var(--teal2),#087b73);border-color:transparent;color:white}.btn:disabled{opacity:.55;cursor:wait}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.layout-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.layout-card{background:#f8fafc;color:#111827;border:2px solid transparent;border-radius:16px;padding:13px;box-shadow:0 12px 30px #0004;transition:.18s transform,.18s border-color;position:relative}.layout-card:hover{transform:translateY(-3px)}.layout-card.selected{border-color:var(--purple);box-shadow:0 0 0 3px #765cf633,0 15px 35px #0005}.recommended{position:absolute;z-index:2;left:11px;top:11px;background:#ffb800;color:#fff;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.plan{height:170px;border-radius:11px;background:#f4f7fa;border:1px solid #e1e7ed;display:grid;place-items:center;overflow:hidden}.plan svg{width:94%;height:94%}.card-title{display:flex;align-items:center;gap:10px;margin-top:12px}.card-title h2{font-size:16px;margin:0;flex:1}.score-ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:5px solid var(--score-color);color:#24303a}.score-ring small{display:block;font-size:8px;color:#81909c;text-align:center}.layout-card p{font-size:12px;color:#82909d;margin:2px 0 10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.metric{background:#eef2f5;border-radius:7px;padding:6px;text-align:center;font-size:9px;color:#75818b}.metric b{display:block;color:#24303a;font-size:11px}.select{width:100%;border:0;border-radius:9px;padding:9px;background:#edf0f3;color:#26313a;font-weight:800}.selected .select{background:linear-gradient(90deg,#2463ee,#5732e9);color:white}
    .side{display:flex;flex-direction:column;gap:16px}.side-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.side-panel h3{margin:0 0 15px;font-size:14px}.room-preview{height:135px;background:#eefaf8;border:1px solid #b9e5df;border-radius:12px;display:grid;place-items:center}.room-box{width:78%;height:66%;border:2px solid var(--teal);border-radius:4px;display:grid;place-items:center;color:#087f77;font-size:11px}.room-meta{display:flex;justify-content:space-between;margin-top:12px}.room-meta strong{font-size:15px}.room-meta span{color:#087f77;font-weight:700;font-size:12px}.active-score{font-size:34px;color:#087f77;font-weight:900}.detail-title{display:flex;align-items:center;justify-content:space-between}.detail-title strong{font-size:20px}.bars{margin-top:14px}.bar-row{display:grid;grid-template-columns:80px 1fr 35px;gap:7px;align-items:center;margin:9px 0;font-size:11px;color:var(--muted)}.track{height:5px;background:#e1e9ec;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--teal);border-radius:9px}.bar-row b{color:#087f77}.error{display:none;background:#fff0f1;color:#b82935;border:1px solid #f1b8bd;border-radius:12px;padding:12px;margin-bottom:15px}.loading .layout-card{opacity:.45}.foot{color:#78868d;text-align:center;font-size:12px;margin-top:25px}
    @media(max-width:1100px){.layout-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:780px){.workspace{grid-template-columns:1fr}.side{grid-row:1}.layout-grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.actions{margin-left:0;flex-wrap:wrap}.shell{padding:22px 16px}}
  </style>
</head>
<body>
  <div class="shell">
    <section class="heading"><div><h1>Generated Furniture Layouts</h1><p>Choose a room type and compare optimized layout options.</p></div><div class="actions"><label for="roomType" style="position:absolute;left:-9999px">Room type</label><select class="room-select" id="roomType" aria-label="Room type"></select><button class="btn" id="newSeed">↻ Regenerate</button><button class="btn primary" id="runButton">Run Module</button></div></section>
    <div class="error" id="error"></div>
    <main class="workspace"><section class="layout-grid" id="layoutGrid" aria-live="polite"></section><aside class="side">
      <section class="side-panel"><h3>Selected Room</h3><div class="room-preview"><div class="room-box" id="roomBox"></div></div><div class="room-meta"><strong id="roomName"></strong><span id="roomSize"></span></div></section>
      <section class="side-panel"><div class="detail-title"><div><h3>Active Selection</h3><strong id="selectedName">—</strong></div><div class="active-score" id="selectedScore">—</div></div><div class="bars" id="scoreBars"></div></section>
    </aside></main>
  </div>
  <script>
    let sample, presets, result, selectedIndex = 0;
    const grid=document.getElementById('layoutGrid'), errorBox=document.getElementById('error'), run=document.getElementById('runButton');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct=(value,maximum)=>Math.round(Math.max(0,Math.min(100,(Number(value)||0)/maximum*100)));
    function metricValues(b){const current=Object.hasOwn(b,'door_clearance');return {door:pct(current?b.door_clearance:b.accessibility, current?20:30),center:pct(current?b.central_open_space:b.distribution, current?20:15),window:pct(current?b.window_proximity:0,15),spacing:pct(current?b.furniture_spacing:b.distribution,15),space:pct(b.space_utilization,current?10:25),wall:pct(b.wall_alignment,current?10:20)}}
    function scoreColor(score){return score>=80?'#31c875':score>=70?'#f2b91f':'#f65b66'}
    function planSvg(layout){const room=sample.room,W=room.width,H=room.length,pad=8,vw=320,vh=190,s=Math.min((vw-pad*2)/W,(vh-pad*2)/H),rw=W*s,rh=H*s,ox=(vw-rw)/2,oy=(vh-rh)/2;let shapes=`<rect x="${ox}" y="${oy}" width="${rw}" height="${rh}" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>`;for(const p of layout.placements){const x=ox+p.position_x*s,y=oy+(H-p.position_y-p.length)*s,w=p.width*s,h=p.length*s;shapes+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#cbd5e1" stroke="#7c8ea0" stroke-width="1.5"/><text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" dominant-baseline="middle" fill="#475569" font-size="8">${esc(p.furniture_id)}</text>`}for(const o of room.openings||[]){let x1,y1,x2,y2;if(o.wall==='south'){x1=ox+o.offset*s;y1=oy+rh;x2=x1+o.width*s;y2=y1}else if(o.wall==='north'){x1=ox+o.offset*s;y1=oy;x2=x1+o.width*s;y2=y1}else if(o.wall==='west'){x1=ox;y1=oy+rh-o.offset*s;x2=x1;y2=y1-o.width*s}else{x1=ox+rw;y1=oy+rh-o.offset*s;x2=x1;y2=y1-o.width*s}shapes+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.kind==='door'?'#16a34a':'#0ea5e9'}" stroke-width="6"/>`}return `<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Furniture layout preview">${shapes}</svg>`}
    function render(){grid.innerHTML=result.layouts.map((l,i)=>{const b=metricValues(l.score_breakdown);return `<article class="layout-card ${i===selectedIndex?'selected':''}" data-index="${i}"><div class="plan">${planSvg(l)}</div><div class="card-title"><h2>Layout ${String.fromCharCode(65+i)}</h2><div class="score-ring" style="--score-color:${scoreColor(l.score)}"><div>${Math.round(l.score)}<small>/100</small></div></div></div><p>${i===0?'Best option for access, open space and natural light.':'Alternative optimized furniture arrangement.'}</p><div class="metrics"><div class="metric">Door access<b>${b.door}%</b></div><div class="metric">Center open<b>${b.center}%</b></div><div class="metric">Spacing<b>${b.spacing}%</b></div></div><button class="select">${i===selectedIndex?'Selected ✓':'Select Layout'}</button></article>`}).join('');document.querySelectorAll('.layout-card').forEach(c=>c.addEventListener('click',()=>{selectedIndex=Number(c.dataset.index);render();renderDetails()}));renderDetails()}
    function renderDetails(){const l=result.layouts[selectedIndex],b=metricValues(l.score_breakdown);document.getElementById('selectedName').textContent=`Layout ${String.fromCharCode(65+selectedIndex)}`;document.getElementById('selectedScore').textContent=Math.round(l.score);const metrics=[['Door access',b.door],['Center open',b.center],['Window table',b.window],['Item spacing',b.spacing],['Space use',b.space],['Wall fit',b.wall]];document.getElementById('scoreBars').innerHTML=metrics.map(([n,v])=>`<div class="bar-row"><span>${n}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}%</b></div>`).join('')}
    async function loadPresets(){presets=await fetch('/api/presets').then(r=>r.json());const selector=document.getElementById('roomType');selector.innerHTML=Object.entries(presets).map(([key,p])=>`<option value="${key}">${esc(p.label)}</option>`).join('');selector.addEventListener('change',()=>{setRoom(selector.value);generate(false)});setRoom(selector.value)}
    function setRoom(key){const preset=presets[key];sample=JSON.parse(JSON.stringify(preset));delete sample.label;sample.layout_count=6;sample.seed=42}
    async function generate(changeSeed=false){run.disabled=true;run.textContent='Generating…';grid.classList.add('loading');errorBox.style.display='none';try{if(!presets)await loadPresets();if(changeSeed)sample.seed=Math.floor(Math.random()*1000000);const response=await fetch('/api/layouts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sample)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Generation failed');result=data;selectedIndex=0;const label=presets[document.getElementById('roomType').value].label;document.getElementById('roomName').textContent=label;document.getElementById('roomSize').textContent=`${sample.room.width}m × ${sample.room.length}m`;document.getElementById('roomBox').textContent=sample.room.id;render()}catch(e){errorBox.textContent=e.message;errorBox.style.display='block'}finally{run.disabled=false;run.textContent='Run Module';grid.classList.remove('loading')}}
    run.addEventListener('click',()=>generate(false));document.getElementById('newSeed').addEventListener('click',()=>generate(true));generate(false);
  </script>
</body>
</html>
